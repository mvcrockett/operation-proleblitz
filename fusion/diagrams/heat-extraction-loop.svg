<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="42" font-size="24" font-weight="bold" fill="#14213d" text-anchor="middle">Heat Extraction and Power Conversion</text>
  <text x="500" y="70" font-size="15" fill="#444444" text-anchor="middle">From Section 5.4 and Schematic 3 of the design document, at her 500 MWth pilot scale.</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#14213d"/>
    </marker>
  </defs>

  <g font-size="15" fill="#14213d">
    <rect x="60" y="130" width="250" height="96" fill="#ffe1a8" stroke="#c2570b" stroke-width="2"/>
    <text x="185" y="162" font-weight="bold" text-anchor="middle">Plasma core</text>
    <text x="185" y="184" text-anchor="middle">D-T burn releases</text>
    <text x="185" y="204" text-anchor="middle">14.1 MeV neutrons</text>
    <line x1="310" y1="178" x2="352" y2="178" stroke="#14213d" stroke-width="2.5" marker-end="url(#arr2)"/>

    <rect x="360" y="130" width="280" height="96" fill="#bfe3dd" stroke="#0f766e" stroke-width="2"/>
    <text x="500" y="162" font-weight="bold" text-anchor="middle">FLiBe blanket</text>
    <text x="500" y="184" text-anchor="middle">About 400 MW thermal deposited</text>
    <text x="500" y="204" text-anchor="middle">(80 percent of 500 MWth, projected)</text>
    <line x1="640" y1="178" x2="682" y2="178" stroke="#14213d" stroke-width="2.5" marker-end="url(#arr2)"/>

    <rect x="690" y="130" width="250" height="96" fill="#bfe3dd" stroke="#0f766e" stroke-width="2"/>
    <text x="815" y="162" font-weight="bold" text-anchor="middle">FLiBe primary loop</text>
    <text x="815" y="184" text-anchor="middle">In at about 500 deg C,</text>
    <text x="815" y="204" text-anchor="middle">out at about 700 deg C, EM pumps</text>

    <line x1="815" y1="226" x2="815" y2="268" stroke="#14213d" stroke-width="2.5" marker-end="url(#arr2)"/>

    <rect x="690" y="272" width="250" height="96" fill="#e8ecf3" stroke="#14213d" stroke-width="2"/>
    <text x="815" y="304" font-weight="bold" text-anchor="middle">Heat exchanger (IHX)</text>
    <text x="815" y="326" text-anchor="middle">FLiBe on one side,</text>
    <text x="815" y="346" text-anchor="middle">supercritical CO2 on the other</text>
    <line x1="690" y1="320" x2="648" y2="320" stroke="#14213d" stroke-width="2.5" marker-end="url(#arr2)"/>

    <rect x="360" y="272" width="280" height="96" fill="#e8ecf3" stroke="#14213d" stroke-width="2"/>
    <text x="500" y="304" font-weight="bold" text-anchor="middle">sCO2 Brayton turbine</text>
    <text x="500" y="326" text-anchor="middle">Inlet about 650 to 700 deg C, 20 to 30 MPa</text>
    <text x="500" y="346" text-anchor="middle">Projected efficiency about 47 percent</text>
    <line x1="360" y1="320" x2="318" y2="320" stroke="#14213d" stroke-width="2.5" marker-end="url(#arr2)"/>

    <rect x="60" y="272" width="250" height="96" fill="#d9ead3" stroke="#38761d" stroke-width="2"/>
    <text x="185" y="304" font-weight="bold" text-anchor="middle">Grid output</text>
    <text x="185" y="326" text-anchor="middle">Projected 235 MWe gross,</text>
    <text x="185" y="346" text-anchor="middle">186 MWe net of auxiliary loads</text>
  </g>

  <rect x="190" y="420" width="620" height="86" fill="#eef2f7" stroke="#7a8699" stroke-width="1.5"/>
  <text x="500" y="446" font-size="14" fill="#14213d" text-anchor="middle">Her projected auxiliary loads total about 49 MW: plasma heating 24 MW, magnets and</text>
  <text x="500" y="467" font-size="14" fill="#14213d" text-anchor="middle">cryocoolers 12 MW, pumps and sCO2 flow 8 MW, tritium extraction 3 MW, controls 2 MW.</text>
  <text x="500" y="488" font-size="14" fill="#14213d" text-anchor="middle">235 minus 49 gives the projected 186 MWe net. The arithmetic closes, the inputs are unverified.</text>

  <rect x="40" y="540" width="920" height="66" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="500" y="566" font-size="14" font-weight="bold" fill="#6b5200" text-anchor="middle">Conceptual framework diagram of the Crockett Reactor, an unproven design by Mary-Victoria Crockett.</text>
  <text x="500" y="588" font-size="14" fill="#6b5200" text-anchor="middle">Not an engineering blueprint. No prototype has been built.</text>
  <rect x="40" y="620" width="920" height="40" fill="#ffffff"/>
  <text x="500" y="645" font-size="13" fill="#555555" text-anchor="middle">All figures on this diagram are her projections unless marked as established physics.</text>
</svg>
